[project]
name = "megadj-python"
version = "0.1.0"
description = "megadj Python seams (rekordbox bridge, art fetch) — pinned deps, strict mypy + ruff"
requires-python = ">=3.11"
dependencies = [
  "mypy>=1.11",
  "ruff>=0.6",
  "mutagen>=1.47",
  # emb_benchmark (tools/) imports numpy at module scope; mypy needs it
  # resolvable to check that file. 2.x is deliberate: its bundled stubs
  # use PEP 695 `type` statements, which require python_version >= 3.12.
  "numpy>=2.0",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
pretty = true
cache_dir = "node_modules/.cache/mypy"
# tools/legacy is dormant (rb_art.py retired behind the WAV→AIFF intake
# converter, issue #101). Gate-covered code: cratedeck/python (device-DB
# seams) + tools (the embedding benchmark harness; its unittest rides
# test:py).
files = ["cratedeck/python", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "node_modules/.cache/ruff"
extend-exclude = ["node_modules", "dist", "tools/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
  "E501", # line length — prettier doesn't own .py; keep readable long lines
]

[tool.ruff.lint.isort]
known-first-party = ["anlz_paths", "usb_verify"]
