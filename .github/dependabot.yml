---
# webuildstuffio org standard — monthly, grouped, bun-first
# Policy: 5-day poison window enforced via bunfig.toml minimumReleaseAge
# NOTE: dependency-type omitted = includes all types (dev + prod).
# "all" is NOT a valid value — Dependabot rejects the config.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "05:00"
    # Cooldown MUST exceed bunfig.toml minimumReleaseAge (5d). Dependabot's
    # default 3-day cooldown is shorter than the install-time poison window,
    # so it can select versions bun then refuses to resolve, failing the job.
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      all-dependencies:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      major-updates:
        update-types:
          - "major"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "bun"
      - "monthly-update"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "05:00"
    cooldown:
      default-days: 5
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    # Ignore the metrics-reusable pin: it points at PRIVATE repo-review, which
    # Dependabot cannot read (403 -> git_dependencies_not_reachable, failing the
    # whole github-actions update job). The pin is bumped manually via chore commits.
    ignore:
      - dependency-name: "webuildstuffio/repo-review/.github/workflows/metrics-reusable.yml"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
      - "monthly-update"
    commit-message:
      prefix: "ci"
      include: "scope"
