# Claude Code Assistant v5.19
# Triggered by @claude mentions in issues, PRs, and reviews
#
# v5.19 - Z.AI routing aligned with claude-code-review v2.1.0: AUTH_TOKEN env
#         (the org ANTHROPIC_API_KEY is a Z.AI credential), base URL defaults
#         to Z.AI's Anthropic-compatible endpoint, sonnet-4-5/haiku-4-5 pins
#         (action default opus-5-5[1m] is not in Z.AI's catalog). Override
#         via vars.CLAUDE_BASE_URL / vars.CLAUDE_MODEL / vars.CLAUDE_SMALL_MODEL.
# v5.18 - Fixed YAML syntax and validated both workflows
# v5.17 - Added comprehensive system prompt with ALL MCP tools guide
# v5.16 - Condensed system prompt by 20% while preserving key info

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      statuses: write
      checks: write
      discussions: write
    steps:
      # Create/Update Claude labels with correct colors
      # This must be first to ensure labels exist before any other steps use them
      - name: Create Claude Labels if Missing
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelsToCreate = [
              { name: '🤖 claude-working', color: 'f97316', description: 'Claude AI is currently analyzing this issue/PR' },
              { name: '✅ claude-complete', color: '22c55e', description: 'Claude AI has successfully completed analysis' },
              { name: '❌ claude-failed', color: 'ef4444', description: 'Claude AI encountered an error during analysis' }
            ];

            for (const label of labelsToCreate) {
              try {
                const existingLabel = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });

                // Update color if it's incorrect
                if (existingLabel.data.color !== label.color) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`✅ Updated label color: ${label.name} → ${label.color}`);
                } else {
                  console.log(`Label already exists with correct color: ${label.name}`);
                }
              } catch (error) {
                if (error.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description
                    });
                    console.log(`✅ Created label: ${label.name} (${label.color})`);
                  } catch (createError) {
                    console.log(`Could not create label ${label.name}:`, createError.message);
                  }
                } else {
                  console.log(`Error checking label ${label.name}:`, error.message);
                }
              }
            }

      # Extract context for tracking
      - name: Extract Context
        id: context
        run: |
          # Determine issue/PR number for later jobs
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "issue_number=${{ github.event.issue.number }}" >> \
                "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "issue_number=${{ github.event.issue.number }}" >> \
                "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ] || \
             [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "issue_number=${{ github.event.pull_request.number }}" >> \
                "$GITHUB_OUTPUT"
          else
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      # Add working badge when starting analysis
      - name: Add Claude Working Badge
        if: ${{ steps.context.outputs.issue_number != '' }}
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.context.outputs.issue_number }}';
            if (!issueNumber) {
              console.log('No issue number available for badge management');
              return;
            }

            console.log(`Managing Claude labels for issue/PR #${issueNumber}`);

            // Remove any existing Claude labels first
            const claudeLabels = [
              '🤖 claude-working',
              '✅ claude-complete',
              '❌ claude-failed',
              '⚡ claude-analyzing'
            ];

            try {
              const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              // Remove existing Claude labels
              for (const label of currentLabels) {
                if (claudeLabels.includes(label.name)) {
                  console.log(`Removing existing label: ${label.name}`);
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label.name,
                  });
                }
              }
            } catch (error) {
              console.log('Error removing existing labels:', error.message);
            }

            // Add working label (already created/verified in previous step)
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['🤖 claude-working'],
            });

            console.log('Added claude-working label');

      # Run Claude Code - @claude mentions, lean fast startup
      # v6.0.0 (Sep 23 2026): fixed the three real failures:
      #  1. --system-prompt had a literal "|" after it inside claude_args (the
      #     CLI received "|" as a positional arg and died). System prompt now
      #     passed via --append-system-prompt with a clean quoted string.
      #  2. Bun + 5 MCP servers installed per-run (2-3 min startup tax).
      #     Dropped the global installs and z.ai http MCPs; web search runs
      #     through the CLI's built-in WebSearch/WebFetch.
      #  3. ANTHROPIC_BASE_URL now defaults to the real Anthropic API; an
      #     ANTHROPIC_BASE_URL repo/org variable can still override it.
      - name: Run Claude Code
        id: claude_action
        uses: anthropics/claude-code-action@v1.0.233
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          track_progress: true
          prompt: |
            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}

            Please help with the task described in the issue/PR above.

            **IMPORTANT**: Ensure you follow the request 100% by completing everything fully. If you strongly disagree with the approach, provide feedback after conducting thorough research.

            **Requirements**:
            - Use the available tools to achieve the best outcome
            - State any failures with tools and suggest workflow improvements
            - Be self-iterating and act as a senior engineer
            - Find the most impactful long-term solutions without overengineering
          claude_args: |
            --max-turns 50
            --append-system-prompt "You are an exceptional Product Manager AND Senior Software Engineer. Balance user needs, business objectives, and technical excellence. Security-review your changes, keep quality high, avoid overengineering. Check for a CLAUDE.md file for project-specific guidelines - it takes precedence. Be pragmatic: perfect vs done, user value first, collaborate clearly."
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Bash(bun:*),Bash(bunx:*),Bash(oxlint:*),Bash(gh:*),Bash(git:*),Bash(node:*),Bash(npx:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*)"
          settings: |
            {
              "env": {
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_API_KEY }}",
                "ANTHROPIC_BASE_URL": "${{ vars.CLAUDE_BASE_URL || 'https://api.z.ai/api/anthropic' }}",
                "ANTHROPIC_MODEL": "${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "${{ vars.CLAUDE_SMALL_MODEL || 'claude-haiku-4-5' }}",
                "API_TIMEOUT_MS": "600000"
              }
            }

      # Update badge to show completion status with enhanced error handling
      - name: Update Claude Completion Badge
        if: always() && steps.context.outputs.issue_number != ''
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.context.outputs.issue_number }}';
            if (!issueNumber) {
              console.log('Could not determine issue/PR number for completion badge');
              return;
            }

            // Determine completion status
            const claudeActionStatus = '${{ steps.claude_action.conclusion }}';

            console.log(`Updating completion badge for issue/PR #${issueNumber}`);
            console.log(`Claude action status: ${claudeActionStatus}`);

            // Remove working label first
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: '🤖 claude-working',
              });
              console.log('Removed claude-working label');
            } catch (error) {
              console.log('Working label not found or already removed');
            }

            // Determine which completion label to add and create informative comment
            let completionLabel, labelColor, labelDescription, commentMessage;

            if (claudeActionStatus === 'success') {
              completionLabel = '✅ claude-complete';
              labelColor = '22c55e';
              labelDescription = 'Claude AI has successfully completed analysis';
              commentMessage = null; // No comment needed for successful completion
            } else if (claudeActionStatus === 'skipped') {
              // Don't add any completion label if Claude was skipped
              console.log('Claude action was skipped, not adding completion label');
              return;
            } else {
              completionLabel = '❌ claude-failed';
              labelColor = 'ef4444';
              labelDescription = 'Claude AI encountered an error during analysis';
              commentMessage = "### ❌ Claude Error\n\nClaude encountered an error during analysis:\n\n**Error Status**: " + claudeActionStatus + "\n\nPlease check the workflow logs for more details or try again later.\n\n---\n*This is an automated error notification.*";
              console.log('Claude error detected');
            }

            // Add completion label (already created/verified in previous step)
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [completionLabel],
            });

            console.log(`Added ${completionLabel} label`);

            // Add informative comment for errors
            if (commentMessage) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: commentMessage,
                });
                console.log('Added informative error comment');
              } catch (commentError) {
                console.log('Error adding comment:', commentError.message);
              }
            }
