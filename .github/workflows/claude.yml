# Claude Code Assistant v5.28.7
# v5.28.7 - (Oct 30 2026) Drop the explicit
#          github_token: ${{ secrets.GITHUB_TOKEN }} from the
#          claude-code-action step. With it passed, the action
#          operates as github-actions[bot] and GitHub's
#          anti-recursion rule parks or suppresses the downstream
#          pull_request runs Claude's pushes create (the CI /
#          Deploy / review action_required classes). With it
#          omitted, the action exchanges the job OIDC token for an
#          official Claude GitHub App installation token and
#          operates as claude[bot], whose events run downstream
#          workflows automatically. The Claude app is installed at
#          org level (repository_selection: all, verified
#          2026-10-30) and the job already carries id-token: write,
#          so no new secrets or permissions are needed. Pilot
#          proof on folio-app: PR 3177 merged, test issue 3178,
#          PR 3179 opened by claude[bot] with zero action_required
#          runs. Rollback is re-adding the one line. Same bump:
#          CLI cache pin 2.1.312 -> 2.1.314 (checksum from
#          Anthropic's release manifest; the pin check flagged the
#          drift on this PR, 2.1.314 released after the last run).
# v5.28.6 - (Oct 28 2026) Remove the Bun download cache from the
#          template: the actions/cache step on ~/.bun/install/cache
#          is dropped where present (the bun-kind variants carrying
#          a Set up Bun + install block; this repo's own variant has
#          no such block). Measured restore median 32s (range
#          29-38s) plus a 1s save to protect a bun install that then
#          takes 1-4s (0-6s cold fleet-wide): the cache costs roughly
#          10x the work it protects, an estimated 22-44 billed
#          min/wk across the 31 repos carrying it. Set up Bun and
#          bun install --frozen-lockfile stay. The Claude Code CLI
#          cache below is unchanged (3s restore, 99 MB, hash-verified
#          exact hits). Supersedes the 2026-10-14 owner override
#          that kept the cache for Claude pre-install: the CI speed
#          audit measurement shows that premise no longer holds.
# v5.28.5 - (Oct 28 2026) CLI cache pin 2.1.311 -> 2.1.312 (checksum
#          from Anthropic's release manifest); the pin check flagged
#          the drift (issue tracking in the pin-check filing).
# v5.28.4 - (Oct 27 2026) allowedTools hardening, completing the
#          drop begun in the ruling candidate for the interpreter
#          wildcard question: node, npx and python3 are joined by
#          python, bunx, pip, pip3 and uv, so no interpreter or
#          package-runner wildcard remains for a prompt-injected
#          run to read the settings env block through. bash, bun,
#          npm and pytest stay, with the git/gh and file tooling:
#          the allowlist raises the bar on that injection path;
#          it is not a sandbox. Same bump: CLI cache pin
#          2.1.310 -> 2.1.311 (checksum from Anthropic's release
#          manifest); the pin check flagged the drift on this PR.
# v5.28.3 - (Oct 26 2026) CLI cache pin 2.1.286 -> 2.1.310 (checksum
#          from Anthropic's release manifest) and the pin is no longer
#          bumped blind: scripts/check-claude-cli-pin.sh compares the
#          pin against the current release manifest, and the
#          claude-cli-pin-check workflow (weekly + on template change)
#          files a visible failure when it drifts (issue #100).
# v5.28.2 - (Oct 24 2026) Label hygiene: a new label-hygiene job fires
#          on issue close / PR merge and strips the robot + failed
#          labels, so merged PRs and closed issues no longer wear a
#          stale claude-failed. Main job never starts on a close event.
# v5.28.1 - (Oct 21 2026) Setup profiles via vars.CLAUDE_SETUP_PROFILE:
#          minimal (default, variable unset) is the unchanged template;
#          agent adds a lite guardrails bootstrap; dev is agent plus the
#          repo's own .claude/setup.sh when present. Agent/dev install
#          checksum-pinned opengrep 1.30.0 + betterleaks 1.9.0 and the
#          ruleset v2 packs/custom rules (cached), then wire lite git
#          hooks via core.hooksPath - betterleaks secret gate at commit,
#          opengrep ERROR gate at push - so findings land inside the
#          run where Claude can fix them. Prompt: never bypass hooks.
# v5.27 - (Oct 21 2026) actions/cache v4 -> v5 (Node 24; v4 was
#          Node 20 and force-run with deprecation warnings).
# v5.26 - (Oct 20 2026) Job timeout 55 / Claude step 45 uniform;
#          --max-turns 150 -> 175 (action post-fails successful
#          results that overshoot the cap while wrapping up);
#          classifier treats a success result as complete even if
#          the step conclusion is failure; prompt adds checkpoint
#          pushes per item + turn discipline.
# Triggered by @claude mentions in issues, PRs, and reviews.
# Uses Z.AI routing (org ANTHROPIC_API_KEY is a Z.AI credential).
#
# v5.25 - (Oct 19 2026) Truthful status labels + speed: the completion
#          badge now classifies every ending — success -> claude-complete,
#          max-turns -> claude-failed-turns, timeout/cancelled ->
#          claude-failed-time (label only, no comment, so superseded
#          runs stay quiet), model/API (gateway) errors -> claude-failed-
#          api, everything else -> claude-failed (incl. never-started).
#          Cancelled runs no longer strand the 🤖 claude-working label.
#          Failure comments carry a handoff (progress branch) and the
#          prompt tells Claude to resume from it instead of re-exploring.
#          Speed: bun pinned 1.4.2, bun install --frozen-lockfile with
#          a download cache, timeout-minutes floor of 45.
# v5.24 - (Oct 14 2026) Cross-stack allowlist: python3/pip/uv/pytest,
#          cargo/rustc, go, npm/pnpm, make + everyday utilities
#          (ls/cat/pwd/echo/chmod/tar/unzip/wc/du/tee/xargs/
#          timeout/sqlite3) so non-JS repos stop eating Bash
#          permission denials; --max-turns 125 -> 150 (turn data:
#          125-cap deaths 6.6%, 13.4s/turn, 150 fits 35-min timeout).
# v5.23 - (Oct 13 2026) Boot + resilience delta: --fallback-model
#          claude-haiku-4-5 + --effort medium, Claude CLI binary
#          cache (path_to_claude_code_executable on cache hit),
#          bun via the existing setup-bun step
#          (path_to_bun_executable), ENABLE_PROMPT_CACHING_1H.
# v5.22 - (Oct 13 2026) Fleet rollout of the pilot template: max-turns
#          75 -> 125, wider Bash allowlist, dependency pre-install +
#          cache before the Claude step, retry watchdog env (the
#          actual retry mechanism), actions:read for the CI MCP
#          tools, show_full_output off, action pin v1.0.238.
# v5.21 - (Sep 30 2026) Bump to v1.0.237 (Claude Code 2.1.285 — native
#          AGENTS.md support, no CLAUDE.md symlink needed). Increased max-turns to 75.
# v5.20 - Concurrency groups, AGENTS.md-first prompt.
# v5.19 - Z.AI routing, sonnet-4-5/haiku-4-5 pins.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, closed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]


jobs:
  claude:
    # Same-issue re-triggers supersede: cancel the stale run instead of
    # billing two 30-min Claude jobs for one issue. Job-level (not
    # workflow-level) on purpose: jobs skipped by the if: below never
    # enter the group, so ordinary comments without a trigger
    # cannot cancel an active run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'closed' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubicloud-standard-2
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      statuses: write
      checks: write
      discussions: write
    steps:
      - name: Create Claude Labels if Missing
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              { name: '🤖 claude-working', color: 'f97316', description: 'Claude AI is currently analyzing this issue/PR' },
              { name: '✅ claude-complete', color: '22c55e', description: 'Claude AI has successfully completed analysis' },
              { name: '❌ claude-failed', color: 'ef4444', description: 'Claude AI encountered an error during analysis' },
              { name: '❌ claude-failed-turns', color: 'ef4444', description: 'Claude AI hit the max-turns cap' },
              { name: '❌ claude-failed-time', color: 'ef4444', description: 'Claude AI run timed out or was cancelled' },
              { name: '❌ claude-failed-api', color: 'ef4444', description: 'Claude AI failed on a model/API (gateway) error' }
            ];
            for (const l of labels) {
              try {
                const existing = await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name });
                if (existing.data.color !== l.color) {
                  await github.rest.issues.updateLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name, color: l.color, description: l.description });
                }
              } catch (e) {
                if (e.status === 404) {
                  try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...l }); } catch {}
                }
              }
            }

      - name: Extract Context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ] || \
               [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "issue_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Claude Lite bootstrap
        if: vars.CLAUDE_SETUP_PROFILE == 'agent' || vars.CLAUDE_SETUP_PROFILE == 'dev'
        env:
          CLAUDE_SETUP_PROFILE: ${{ vars.CLAUDE_SETUP_PROFILE }}
          CLAUDE_LITE_SELFTEST: ${{ vars.CLAUDE_LITE_SELFTEST }}
          CLAUDE_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          # claude-lite bootstrap (template v5.28.1). Runs only when the repo sets
          # vars.CLAUDE_SETUP_PROFILE to agent or dev. Installs the guardrail
          # tools (checksum-pinned release downloads, verified before use;
          # deliberately no actions/cache: comment-triggered runs get read-only
          # cache at best, and a post-job save would persist agent-writable
          # files), installs the
          # ruleset v2, writes the lite git hooks, and points this checkout's
          # core.hooksPath at them so Claude's own git commands run the gates.
          LITE="$HOME/.claude-lite"
          mkdir -p "$LITE/bin" "$LITE/hooks" "$LITE/rules"
          OG_SHA256="35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c"
          BL_SHA256="f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"
          BL_BIN_SHA256="0ace40b41652344608f89967fe93c6caf4faae9a4df20423632c7efb02a4d4e1"
          sha_ok() { [ -f "$1" ] && echo "$2  $1" | sha256sum --check - >/dev/null 2>&1; }
          if ! sha_ok "$LITE/bin/opengrep" "$OG_SHA256"; then
            tmp=$(mktemp -d)
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 300 -o "$tmp/opengrep" \
              "https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86"
            echo "$OG_SHA256  $tmp/opengrep" | sha256sum --check -
            install -m 755 "$tmp/opengrep" "$LITE/bin/opengrep"
            rm -rf "$tmp"
          fi
          if ! sha_ok "$LITE/bin/betterleaks" "$BL_BIN_SHA256"; then
            tmp=$(mktemp -d)
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o "$tmp/bl.tgz" \
              "https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz"
            echo "$BL_SHA256  $tmp/bl.tgz" | sha256sum --check -
            tar --no-same-owner -xzf "$tmp/bl.tgz" -C "$tmp" betterleaks
            echo "$BL_BIN_SHA256  $tmp/betterleaks" | sha256sum --check -
            install -m 755 "$tmp/betterleaks" "$LITE/bin/betterleaks"
            rm -rf "$tmp"
          fi
          # Ruleset v2: 10 registry packs, pre-downloaded as local files so hook
          # scans never resolve packs over the network; plus the custom rules,
          # whose canonical source is repo-review
          # worker/scripts/opengrep/ai-agent-security-v2.yml (#354), inlined here
          # because a caller's GITHUB_TOKEN cannot read that private repo (the
          # same pattern #355 uses).
          # Pinning note (measured 2026-10-21): the pack endpoints are NOT
          # byte-stable - downloads hours apart returned same-size files with
          # rotated rule membership, so a fixed pack hash would brick runs.
          # Packs are integrity-checked structurally (sizeable, top-level
          # rules list) and their combined hash is logged every run as drift
          # telemetry across runs. The custom
          # rules ARE hard-pinned: a mismatch means the inlined copy was altered.
          CUSTOM_SHA256="2f5c5d02b0dd7ddc859eb1ac049ee35cb06a2ccfc6170cfdea8798a00a157e6d"
          if ! sha_ok "$LITE/rules/ai-agent-security-v2.yml" "$CUSTOM_SHA256"; then
            cat > "$LITE/rules/ai-agent-security-v2.yml" <<'CLAUDE_LITE_RULES_EOF'
          # yamllint disable
          # (vendored upstream-format rules file: byte-faithful to the
          # experiment asset, whose list style predates this repo's yamllint
          # indentation rule; semantics verified by the opengrep test suite.)
          #
          # ai-agent-security-v2.yml -- Opengrep custom rules, ruleset v2
          # (repo-review#354). SOURCE OF TRUTH for the copy inlined into
          # .github/workflows/security-scan-reusable.yml (a caller's GITHUB_TOKEN
          # cannot read this private repo, so the reusable carries the file as a
          # heredoc; worker/scripts/tests/security-scan-opengrep.test.sh fails
          # on drift between the two copies).
          #
          # Provenance: filtered from shell-config's .opengrep/rules/
          # ai-agent-security.yml by the 2026-10-21 fleet Opengrep experiment
          # round 2 (25 of 32 rules kept). REMOVED -- the two broken families
          # (68% of round-1 noise, fired on ordinary code):
          #   javascript-prompt-injection-template, javascript-prompt-injection-concat,
          #   python-prompt-injection-{fstring,format,percent,concat},
          #   javascript-tool-no-validation
          # Those stay report-only/local until rewritten name-anchored.
          rules:
          - id: python-llm-call-user-input
            pattern-either:
            - pattern: 'openai.$FUNC(..., messages=[{"role": "user", "content": $INPUT}], ...)'
            - pattern: 'openai.$FUNC(..., messages=[{''role'': ''user'', ''content'': $INPUT}],
                ...)'
            message: Direct user input to LLM call (sanitize first)
            languages:
            - python
            severity: WARNING
            metadata:
              category: security
              remediation: Use input sanitization and allowlist patterns
          - id: mcp-sampling-all-servers-context
            pattern: 'includeContext: "allServers"'
            message: MCP sampling with broad context access (data exfiltration risk)
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              impact: May allow MCP server to access data from other servers
              reference: https://authzed.com/blog/timeline-mcp-breaches/
          - id: mcp-sampling-all-context
            pattern: 'includeContext: "all"'
            message: MCP sampling with all context access (review if necessary)
            languages:
            - yaml
            - json
            severity: WARNING
            metadata:
              category: security
              remediation: Use 'ownServer' or specify exact servers
          - id: mcp-unrestricted-permissions
            pattern: "permissions:\n  - \"*\"\n"
            message: Wildcard MCP permissions (specify exact permissions)
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Use exact permission names instead of wildcard
          - id: mcp-disabled-authentication
            pattern: 'authentication: "none"'
            message: MCP server without authentication (security risk)
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Enable authentication for MCP servers
          - id: mcp-unrestricted-resource-access
            pattern: "resources:\n  - \"*\"\n"
            message: Unrestricted MCP resource access (specify exact resources)
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Specify exact resource paths instead of wildcard
          - id: mcp-cross-tenant-access
            pattern: 'allowCrossTenantAccess: true'
            message: MCP cross-tenant access enabled (data privacy risk)
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              impact: May allow accessing data across tenant boundaries
              reference: Asana MCP breach (June 2025)
          - id: mcp-broad-server-access
            pattern: 'serverAccess: "all"'
            message: MCP with broad server access (specify exact servers)
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Specify exact server names instead of 'all'
          - id: typescript-tool-any-type
            pattern: 'const $TOOL = async ($PARAMS: any) => ...'
            message: Tool with 'any' type (no schema validation)
            languages:
            - typescript
            severity: ERROR
            metadata:
              category: security
              remediation: Use Zod or similar schema validation library
              impact: May allow injection attacks via tool parameters
          - id: python-tool-no-validation
            pattern: "def $TOOL($PARAMS):\n    return $FUNC($PARAMS)\n"
            message: Tool function without parameter validation
            languages:
            - python
            severity: ERROR
            metadata:
              category: security
              remediation: Use Pydantic or similar validation library
              impact: May allow injection attacks via tool parameters
          - id: python-tool-exec-code-param
            pattern: exec($PARAMS)
            message: Tool executes code from parameters without validation
            languages:
            - python
            severity: ERROR
            metadata:
              category: security
              impact: Remote code execution vulnerability
              reference: CVE-2025-6514 (mcp-remote RCE)
          - id: typescript-tool-eval-param
            pattern: eval($PARAMS.$PROP)
            message: Tool evaluates code from parameters (RCE risk)
            languages:
            - typescript
            - javascript
            severity: ERROR
            metadata:
              category: security
              impact: Remote code execution vulnerability
          - id: python-tool-subprocess-param
            pattern: subprocess.run($PARAMS, shell=True)
            message: Tool runs subprocess with parameters (command injection risk)
            languages:
            - python
            severity: ERROR
            metadata:
              category: security
              impact: Command injection vulnerability
          - id: python-hardcoded-openai-key
            pattern: api_key = "sk-..."
            message: Hardcoded OpenAI API key (use environment variables)
            languages:
            - python
            severity: ERROR
            metadata:
              category: security
              remediation: Use os.getenv('OPENAI_API_KEY') instead
          - id: python-hardcoded-anthropic-key
            pattern: api_key = "sk-ant-..."
            message: Hardcoded Anthropic API key (use environment variables)
            languages:
            - python
            severity: ERROR
            metadata:
              category: security
              remediation: Use os.getenv('ANTHROPIC_API_KEY') instead
          - id: javascript-hardcoded-llm-key
            pattern: 'apiKey: "sk-..."'
            message: Hardcoded LLM API key in object (use environment variables)
            languages:
            - javascript
            - typescript
            severity: ERROR
            metadata:
              category: security
              remediation: Use process.env.API_KEY instead
          - id: env-llm-key-not-from-env
            pattern: 'const apiKey = "sk-..."

              '
            message: LLM API key not from environment variable
            languages:
            - javascript
            - typescript
            severity: ERROR
            metadata:
              category: security
              remediation: Use process.env to load API keys
          - id: python-autonomous-system-command
            pattern: subprocess.run($CMD, shell=True)
            message: Autonomous system command execution (add human approval)
            languages:
            - python
            severity: WARNING
            metadata:
              category: security
              remediation: Add human-in-the-loop approval for dangerous operations
          - id: python-autonomous-file-delete
            pattern: 'os.remove($PATH)

              '
            message: Autonomous file deletion (add human approval)
            languages:
            - python
            severity: WARNING
            metadata:
              category: security
              remediation: Add human-in-the-loop approval for destructive operations
          - id: python-autonomous-file-write
            pattern: "with open($PATH, \"w\") as f:\n    f.write($DATA)\n"
            message: Autonomous file write operation (review if necessary)
            languages:
            - python
            severity: INFO
            metadata:
              category: security
          - id: javascript-autonomous-system-command
            pattern: 'exec($CMD)

              '
            message: Autonomous system command execution (add human approval)
            languages:
            - javascript
            - typescript
            severity: WARNING
            metadata:
              category: security
              remediation: Add human-in-the-loop approval for dangerous operations
          - id: mcp-server-access-all-databases
            pattern: 'databases: ["*"]'
            message: MCP server with wildcard database access
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Specify exact database names
          - id: mcp-server-access-all-tables
            pattern: 'tables: ["*"]'
            message: MCP server with wildcard table access
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Specify exact table names
          - id: mcp-broad-file-access
            pattern: 'allowedPaths: "/*"'
            message: MCP server with broad file system access
            languages:
            - yaml
            - json
            severity: ERROR
            metadata:
              category: security
              remediation: Restrict to specific directories
          - id: python-llm-unrestricted-tool-access
            pattern: tools=$ALL_TOOLS
            message: LLM with unrestricted tool access (specify exact tools)
            languages:
            - python
            severity: WARNING
            metadata:
              category: security
              remediation: Specify exact tool list instead of wildcard
          CLAUDE_LITE_RULES_EOF
          fi
          echo "$CUSTOM_SHA256  $LITE/rules/ai-agent-security-v2.yml" | sha256sum --check -
          # The custom rules are the security-critical file: prove opengrep can
          # actually load them before any hook relies on them.
          "$LITE/bin/opengrep" --validate --config "$LITE/rules/ai-agent-security-v2.yml" >/dev/null \
            || { echo "claude-lite: custom rules fail opengrep --validate" >&2; exit 1; }
          pack_ok() {
            # Dependency-free structural check (no PyYAML assumption): a real
            # pack is a sizeable YAML document carrying a top-level rules list.
            # Anything corrupt enough to matter also fails loudly downstream -
            # the pre-push scan loads every config and fails closed on errors.
            [ -s "$1" ] || return 1
            [ "$(stat -c%s "$1" 2>/dev/null || echo 0)" -gt 10000 ] || return 1
            # The registry content-negotiates: YAML (rules:) or JSON ({"rules":)
            # depending on the request; both are valid opengrep configs.
            grep -q '^rules:' "$1" || head -c 64 "$1" | grep -q '{"rules"'
          }
          for pack in security-audit owasp-top-ten typescript javascript python rust golang terraform dockerfile github-actions; do
            if ! pack_ok "$LITE/rules/pack-$pack.yml"; then
              curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 -H 'Accept: text/yaml' "https://semgrep.dev/c/p/$pack" -o "$LITE/rules/pack-$pack.yml"
              pack_ok "$LITE/rules/pack-$pack.yml" || { echo "claude-lite: downloaded pack $pack is not well-formed" >&2; exit 1; }
            fi
          done
          packs_hash=$(cat "$LITE"/rules/pack-*.yml | sha256sum | cut -d' ' -f1)
          echo "claude-lite: ruleset packs manifest sha256 $packs_hash (telemetry; pack endpoints are not byte-stable)"
          # Warm the opengrep runtime extraction now, not inside Claude's first push.
          "$LITE/bin/opengrep" --version >/dev/null 2>&1 || true
          "$LITE/bin/betterleaks" version >/dev/null 2>&1 || true
          cat > "$LITE/hooks/pre-commit" <<'CLAUDE_LITE_HOOK_EOF'
          #!/usr/bin/env bash
          # claude-lite pre-commit (template v5.28.1, CLAUDE_SETUP_PROFILE=agent/dev).
          # Gate: betterleaks secret scan over the staged content (~1s). Opengrep
          # runs at pre-push instead: its per-invocation rule-compile cost (~30s)
          # is paid once per push, not once per checkpoint commit.
          # Fail-closed: on findings, and when betterleaks is missing (the
          # bootstrap installs and verifies it before pointing hooksPath here,
          # so a missing scanner is tampering or corruption, never a pass). Output goes to stderr so Claude sees it in the
          # git error and can fix the finding and retry.
          set -uo pipefail
          LITE="${CLAUDE_LITE_HOME:-$HOME/.claude-lite}"
          BL="$LITE/bin/betterleaks"
          if [ ! -x "$BL" ]; then
            echo "== claude-lite: betterleaks is missing ($BL) - commit blocked ==" >&2
            echo "== the lite bootstrap installs and verifies it; a missing scanner is never a silent pass ==" >&2
            exit 1
          fi
          root=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0
          cd "$root" || exit 0
          git diff --cached --quiet && exit 0
          bl_out=$(mktemp)
          timeout 120 "$BL" git --staged --redact --no-banner . >"$bl_out" 2>&1
          bl_rc=$?
          if [ "$bl_rc" -eq 124 ]; then
            echo "== claude-lite: betterleaks scan timed out (120s) - commit blocked ==" >&2
            rm -f "$bl_out"
            exit 1
          fi
          if [ "$bl_rc" -ne 0 ]; then
            echo "== claude-lite: betterleaks found secret(s) in the staged changes - commit blocked ==" >&2
            echo "== recovery: commit everything else and report this file. Only if the value is a demonstrably fake fixture may you add its fingerprint (printed above) to .betterleaksignore and retry. A real-looking secret is never committed. ==" >&2
            tail -25 "$bl_out" >&2
            echo "== remove the secret(s), load them from the environment, and commit again ==" >&2
            rm -f "$bl_out"
            exit 1
          fi
          rm -f "$bl_out"
          exit 0
          CLAUDE_LITE_HOOK_EOF
          cat > "$LITE/hooks/pre-push" <<'CLAUDE_LITE_HOOK_EOF'
          #!/usr/bin/env bash
          # claude-lite pre-push (template v5.28.1, CLAUDE_SETUP_PROFILE=agent/dev).
          # Backstop for the push: betterleaks over the pushed commit range +
          # opengrep ERROR gate over the range's changed files. The opengrep scan
          # runs on the pushed commit's blobs (git archive into a scratch dir),
          # never on the mutable worktree, and FAILS CLOSED: a scanner crash, a
          # missing/unparseable report, or a report carrying scan errors blocks
          # the push just like a finding does.
          set -uo pipefail
          LITE="${CLAUDE_LITE_HOME:-$HOME/.claude-lite}"
          OG="$LITE/bin/opengrep"
          BL="$LITE/bin/betterleaks"
          if [ ! -x "$OG" ] || [ ! -x "$BL" ] || [ ! -d "$LITE/rules" ]; then
            echo "== claude-lite: guardrail tools missing (opengrep/betterleaks/rules) - push blocked ==" >&2
            echo "== the lite bootstrap installs and verifies them; missing tools are never a silent pass ==" >&2
            exit 1
          fi
          root=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0
          cd "$root" || exit 0
          ZERO=0000000000000000000000000000000000000000
          rc=0
          while read -r _local_ref local_sha _remote_ref remote_sha; do
            [ "$local_sha" = "$ZERO" ] && continue
            if [ "$remote_sha" = "$ZERO" ]; then
              range="new branch at $local_sha"
              # Only origin's remote-tracking refs count as already-pushed:
              # refs fetched from any other remote were never scanned anywhere.
              excl=()
              while read -r ref; do excl+=("^$ref"); done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
              log_opts="$local_sha ${excl[*]}"
              files=()
              while IFS= read -r -d '' f; do files+=("$f"); done < <(
                git rev-list "$local_sha" "${excl[@]}" |
                while read -r c; do git diff-tree --root --diff-merges=separate --no-commit-id --name-only -r -z --diff-filter=ACMR "$c"; done | sort -zu)
            else
              range="$remote_sha..$local_sha"
              log_opts="$range"
              mapfile -d '' -t files < <(git diff --name-only -z --diff-filter=ACMR "$remote_sha" "$local_sha")
            fi
            if [ -x "$BL" ]; then
              bl_out=$(mktemp)
              timeout 300 "$BL" git --redact --no-banner --log-opts "$log_opts" . >"$bl_out" 2>&1
              bl_rc=$?
              if [ "$bl_rc" -eq 124 ]; then
                echo "== claude-lite: betterleaks scan timed out (300s) for $range - push blocked ==" >&2
                rc=1
              elif [ "$bl_rc" -ne 0 ]; then
                echo "== claude-lite: betterleaks found secret(s) in $range - push blocked ==" >&2
                echo "== recovery: same rule as pre-commit - only a demonstrably fake fixture value may be triaged via .betterleaksignore; never commit a real-looking secret. ==" >&2
                tail -25 "$bl_out" >&2
                rc=1
              fi
              rm -f "$bl_out"
            fi
            if [ -x "$OG" ] && [ -d "$LITE/rules" ] && [ "${#files[@]}" -gt 0 ]; then
              declare -A at_tip=()
              while IFS= read -r -d '' f; do at_tip["$f"]=1; done < <(git ls-tree -r -z --name-only "$local_sha")
              present=()
              for f in "${files[@]}"; do
                [ -n "${at_tip[$f]:-}" ] || continue
                case "/$f" in
                  */node_modules/*|*/.next/*|*/dist/*|*/target/*|*/build/*|*/out/*|*/vendor/*|*/.turbo/*) continue ;;
                esac
                case "$f" in *.min.js|*.min.css) continue ;; esac
                present+=("$f")
              done
              if [ "${#present[@]}" -gt 0 ]; then
                scan_dir=$(mktemp -d)
                if ! git archive "$local_sha" -- "${present[@]/#/:(literal)}" | tar --no-same-owner -x -C "$scan_dir"; then
                  echo "== claude-lite: could not extract $local_sha for scanning - push blocked ==" >&2
                  rc=1
                else
                  cfg=()
                  for f in "$LITE"/rules/*.yml; do cfg+=(--config "$f"); done
                  out=$(mktemp)
                  err=$(mktemp)
                  (cd "$scan_dir" && OPENGREP_ENABLE_VERSION_CHECK=0 SEMGREP_SEND_METRICS=off \
                    timeout 600 "$OG" scan --disable-version-check --json --quiet --output "$out" "${cfg[@]}" \
                    --exclude node_modules --exclude .next --exclude dist --exclude target \
                    --exclude build --exclude out --exclude vendor --exclude .turbo \
                    --exclude '*.min.js' --exclude '*.min.css' \
                    --exclude-rule 'package_managers.bun.bun-missing-minimum-release-age.bun-missing-minimum-release-age' \
                    --exclude-rule 'javascript.lang.security.detect-child-process.detect-child-process' \
                    --exclude-rule 'yaml.github-actions.security.secrets-inherit.secrets-inherit' \
                    -- "${present[@]}" >/dev/null 2>"$err")
                  og_rc=$?
                  if [ "$og_rc" -ge 2 ] || [ ! -s "$out" ]; then
                    echo "== claude-lite: opengrep scan failed (exit $og_rc) - push blocked ==" >&2
                    echo "== scanner diagnostics (tail) ==" >&2
                    tail -30 "$err" >&2
                    rc=1
                  elif ! python3 - "$out" <<'PYEOF'
          import json, sys
          try:
              doc = json.load(open(sys.argv[1]))
          except Exception:
              print("claude-lite: opengrep report unparseable - treating as scan failure", file=sys.stderr)
              sys.exit(2)
          scan_errors = doc.get("errors") or []
          if scan_errors:
              print("claude-lite: opengrep reported {} scan error(s) - treating as scan failure".format(len(scan_errors)), file=sys.stderr)
              sys.exit(2)
          errs = [r for r in doc.get("results", [])
                  if (r.get("extra") or {}).get("severity") == "ERROR"]
          for r in errs:
              print("{}:{}: {} - {}".format(
                  r.get("path"), (r.get("start") or {}).get("line"),
                  r.get("check_id"), (r.get("extra") or {}).get("message", "")),
                  file=sys.stderr)
          sys.exit(1 if errs else 0)
          PYEOF
                  then
                    echo "== claude-lite: opengrep gate failed for $range - push blocked ==" >&2
                    echo "== recovery: push everything except the flagged files (commit them locally if useful) and put the blocked work in your issue summary so it is not lost. Do not bypass this gate. ==" >&2
                    echo "== fix the findings and push again; do not bypass this hook ==" >&2
                    rc=1
                  fi
                  rm -f "$out" "$err"
                fi
                rm -rf "$scan_dir"
              fi
            fi
          done
          exit $rc
          CLAUDE_LITE_HOOK_EOF
          chmod +x "$LITE/hooks/pre-commit" "$LITE/hooks/pre-push"
          if [ "${CLAUDE_SETUP_PROFILE:-}" = "dev" ] && [ -f .claude/setup.sh ]; then
            # Note: on issue_comment runs the checkout (and this workflow) is the
            # default branch by GitHub's event semantics, so the setup script is
            # main's version - intended: PR branches cannot weaken the hooks
            # either, for the same reason.
            if [ "${CLAUDE_IS_FORK:-}" = "true" ]; then
              echo "claude-lite: SKIPPING .claude/setup.sh - fork PR runs never execute workspace-controlled setup code"
            else
              echo "claude-lite: running repo .claude/setup.sh (dev profile)"
              bash .claude/setup.sh
            fi
          fi
          git config core.hooksPath "$LITE/hooks"
          echo "claude-lite: guardrails active (profile=${CLAUDE_SETUP_PROFILE:-minimal}); hooks at $LITE/hooks"
          if [ "${CLAUDE_LITE_SELFTEST:-}" = "1" ]; then
            echo "claude-lite: running hook self-test (pilot mode)"
            (
              st=$(mktemp -d)
              trap 'rm -rf "$st"' EXIT
              git init -q -b main "$st/repo"
              git init -q --bare "$st/remote.git"
              cd "$st/repo"
              git config user.email lite@selftest.invalid
              git config user.name claude-lite-selftest
              git config core.hooksPath "$LITE/hooks"
              echo ok > README.md
              git add .
              git commit -q -m init
              git push -q "$st/remote.git" main
              # The probe secret is generated at runtime: no token-shaped literal
              # ever sits in this workflow file for other scanners to flag.
              probe_token="ghp_$(python3 -c "import secrets, string; print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))")"
              printf 'TOKEN = "%s"\n' "$probe_token" > secret_probe.py
              git add secret_probe.py
              if git commit -q -m probe-secret 2>"$st/log1"; then
                echo "::error::claude-lite self-test FAILED: a seeded secret commit was not blocked at commit"
                exit 1
              fi
              echo "claude-lite self-test: secret commit blocked at pre-commit (betterleaks)"
              git reset -q
              rm -f secret_probe.py
              printf 'import subprocess\ndef run_tool(params):\n    return subprocess.run(params, shell=True)\n' > og_probe.py
              git add og_probe.py
              git commit -q -m probe-opengrep
              if git push -q "$st/remote.git" main 2>"$st/log2"; then
                echo "::error::claude-lite self-test FAILED: a seeded opengrep ERROR was not blocked at push"
                exit 1
              fi
              echo "claude-lite self-test: opengrep ERROR blocked at pre-push"
            )
            echo "claude-lite self-test: PASS"
          fi
      - name: Add Claude Working Badge
        if: ${{ steps.context.outputs.issue_number != '' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const n = '${{ steps.context.outputs.issue_number }}';
            if (!n) return;
            const claudeLabels = ['🤖 claude-working', '✅ claude-complete', '❌ claude-failed', '❌ claude-failed-turns', '❌ claude-failed-time', '❌ claude-failed-api'];
            try {
              const current = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner: context.repo.owner, repo: context.repo.repo, issue_number: n, per_page: 100 });
              for (const label of current) {
                if (claudeLabels.includes(label.name)) {
                  await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, name: label.name });
                }
              }
            } catch {}
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, labels: ['🤖 claude-working'] });

      - name: Set up Bun
        id: setup-bun

        uses: oven-sh/setup-bun@v2

        with:

          bun-version: 1.4.2


      - name: Install dependencies

        run: bun install --frozen-lockfile


      - name: Cache Claude Code CLI
        id: claude-cli-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/claude
            ~/.local/share/claude
          key: claude-cli-2.1.314-${{ runner.os }}-${{ runner.arch }}

      - name: Resolve cached Claude Code CLI
        id: claude-bin
        run: |
          # The cache is agent-writable state, so a restored binary is
          # only used after its SHA256 matches the official Claude Code
          # 2.1.314 linux-x64 release checksum (Anthropic manifest).
          # Drift is watched by scripts/check-claude-cli-pin.sh (issue
          # #100); bump version + checksum together when it fires.
          want="4487042b4c4f5d88d4568f68ae98aae0b1ffae58864cf57fb868641bc5f84594"
          bin="$HOME/.local/bin/claude"
          hit="${{ steps.claude-cli-cache.outputs.cache-hit }}"
          got="$(sha256sum "$(readlink -f "$bin" 2>/dev/null)" 2>/dev/null | cut -d' ' -f1)"
          if [ "$hit" = "true" ] && [ -x "$bin" ] && [ "$got" = "$want" ]; then
            echo "path=$bin" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: claude_action
        timeout-minutes: 45
        uses: anthropics/claude-code-action@v1.0.257
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.claude-bin.outputs.path }}
          path_to_bun_executable: ${{ steps.setup-bun.outputs.bun-path }}
          show_full_output: false
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}

            Help with the task described in the issue/PR above. Complete it 100%.
            Read AGENTS.md at the repo root first for project-specific guidelines.
          claude_args: |
            --max-turns 175
            --fallback-model claude-haiku-4-5
            --effort medium
            --append-system-prompt "You are a senior SWE. Read AGENTS.md at the repo root first — it has project-specific guidelines that take precedence. Security-review your changes, keep quality high, avoid overengineering. Be pragmatic: user value first. If a comment marked 'claude-handoff' names a progress branch, continue from that branch instead of starting over. Work item by item: after finishing each numbered item, commit and push to your branch before starting the next one. Be economical with turns: batch independent tool calls in one block, read each file once, and run the full check suite once at the end rather than after every edit. Never bypass git hooks (no --no-verify, no core.hooksPath overrides): if a hook blocks a commit or push, read its output and recover, never bypass: for a secret finding, commit everything else and report the blocked file (only a demonstrably fake fixture value may be triaged via a .betterleaksignore fingerprint entry; a real-looking secret is never committed); for a code finding, push everything except the flagged files and put the blocked work in your summary so it is not lost."
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Bash(bun:*),Bash(oxlint:*),Bash(gh:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(jq:*),Bash(curl:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(awk:*),Bash(diff:*),Bash(sort:*),Bash(which:*),Bash(env:*),Bash(sleep:*),Bash(pytest:*),Bash(cargo:*),Bash(rustc:*),Bash(go:*),Bash(npm:*),Bash(pnpm:*),Bash(make:*),Bash(ls:*),Bash(cat:*),Bash(pwd:*),Bash(echo:*),Bash(chmod:*),Bash(tar:*),Bash(unzip:*),Bash(wc:*),Bash(du:*),Bash(tee:*),Bash(xargs:*),Bash(timeout:*),Bash(sqlite3:*),Bash(bash:*)"
          settings: |
            {
              "env": {
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_API_KEY }}",
                "ANTHROPIC_BASE_URL": "${{ vars.CLAUDE_BASE_URL || 'https://api.z.ai/api/anthropic' }}",
                "ANTHROPIC_MODEL": "${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "${{ vars.CLAUDE_SMALL_MODEL || 'claude-haiku-4-5' }}",
                "API_TIMEOUT_MS": "600000",
                "CLAUDE_CODE_RETRY_WATCHDOG": "1",
                "CLAUDE_CODE_MAX_RETRIES": "10",
                "ENABLE_PROMPT_CACHING_1H": "1"
              }
            }

      - name: Update Claude Completion Badge
        if: always() && steps.context.outputs.issue_number != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const n = '${{ steps.context.outputs.issue_number }}';
            if (!n) return;
            const status = '${{ steps.claude_action.conclusion }}';
            const execFile = '${{ steps.claude_action.outputs.execution_file }}';
            const actionBranch = '${{ steps.claude_action.outputs.branch_name }}';
            const statusLabels = ['🤖 claude-working', '✅ claude-complete', '❌ claude-failed', '❌ claude-failed-turns', '❌ claude-failed-time', '❌ claude-failed-api'];
            const stripStatus = async (except) => {
              try {
                const current = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner: context.repo.owner, repo: context.repo.repo, issue_number: n, per_page: 100 });
                for (const l of current) {
                  if (statusLabels.includes(l.name) && l.name !== except) {
                    try { await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, name: l.name }); } catch {}
                  }
                }
              } catch {}
            };
            if (status === 'skipped' || !status) {
              let setupFailed = false;
              try {
                const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId });
                const job = jobs.data.jobs.find(j => j.name === 'claude') || jobs.data.jobs[0];
                setupFailed = !!(job && job.steps && job.steps.some(s => s.conclusion === 'failure'));
              } catch {}
              if (!setupFailed) { await stripStatus(''); return; }
            }
            let reason = '';
            let subtype = '';
            let resultText = '';
            try {
              const fs = require('fs');
              const raw = fs.readFileSync(execFile, 'utf8').trim();
              let data;
              try { data = JSON.parse(raw); } catch { data = JSON.parse(raw.split('\n').pop()); }
              let msg = data;
              let extraErrors = '';
              if (Array.isArray(data)) {
                msg = [...data].reverse().find(m => m && m.type === 'result') || data[data.length - 1] || {};
                const withErrors = [...data].reverse().find(m => m && Array.isArray(m.errors) && m.errors.length);
                if (withErrors) extraErrors = JSON.stringify(withErrors.errors);
              } else if (data && Array.isArray(data.errors)) {
                extraErrors = JSON.stringify(data.errors);
              }
              reason = (msg && msg.terminal_reason) || '';
              subtype = (msg && msg.subtype) || '';
              resultText = [((msg && msg.result) || ''), (msg && Array.isArray(msg.errors) && msg.errors.length) ? JSON.stringify(msg.errors) : '', extraErrors].filter(Boolean).join(' ');
            } catch {}
            let label;
            let why = status;
            if (status === 'skipped' || !status) {
              label = '❌ claude-failed';
              why = 'setup failed before Claude started';
            } else if (status === 'success' || subtype === 'success') {
              label = '✅ claude-complete';
            } else if (status === 'cancelled') {
              label = '❌ claude-failed-time';
              why = 'timed out or cancelled';
            } else if (reason === 'error_max_turns' || reason === 'max_turns' || subtype === 'error_max_turns') {
              label = '❌ claude-failed-turns';
              why = 'reached max turns';
            } else if (reason === 'model_error' || /api[ _]error|overloaded|rate[ _]limit|too many requests|api timeout/i.test(reason + ' ' + subtype + ' ' + resultText)) {
              label = '❌ claude-failed-api';
              why = 'model/API (gateway) error';
            } else if (!reason && !resultText.trim() && status === 'failure') {
              let elapsedMin = 0;
              try {
                const run = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId });
                elapsedMin = (Date.now() - new Date(run.data.run_started_at).getTime()) / 60000;
              } catch {}
              if (elapsedMin > 30) {
                label = '❌ claude-failed-time';
                why = 'timed out (step killed, no result)';
              } else {
                label = '❌ claude-failed';
              }
            } else {
              label = '❌ claude-failed';
            }
            await stripStatus(label);
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, labels: [label] });
            if (label !== '✅ claude-complete' && status !== 'cancelled') {
              let branch = actionBranch || '';
              if (!branch) {
                try {
                  const refs = await github.rest.git.listMatchingRefs({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/claude/issue-${n}-` });
                  if (refs.data.length) branch = refs.data[refs.data.length - 1].ref.replace('refs/heads/', '');
                } catch {}
              }
              if (!branch) {
                try {
                  const refs = await github.rest.git.listMatchingRefs({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/claude/pr-${n}-` });
                  if (refs.data.length) branch = refs.data[refs.data.length - 1].ref.replace('refs/heads/', '');
                } catch {}
              }
              const lines = ['### ❌ Claude Error', '', `Status: ${why}. Check [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }}).`];
              if (branch) lines.push('', `<!-- claude-handoff --> Progress branch: \`${branch}\` — a re-trigger should continue from it.`);
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, body: lines.join('\n') });
            }

  label-hygiene:
    # Terminal-state label cleanup. Runs only on close events (job-level
    # if), independent of the claude job's concurrency group on purpose.
    if: github.event.action == 'closed' && (github.event_name == 'issues' || github.event.pull_request.merged == true)
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Strip stale Claude status labels on close
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const payload = context.payload;
            const isPR = !!payload.pull_request;
            if (isPR && !payload.pull_request.merged) return;
            const n = context.issue.number;
            if (!n) return;
            const stale = ['🤖 claude-working', '❌ claude-failed', '❌ claude-failed-turns', '❌ claude-failed-time', '❌ claude-failed-api'];
            const res = await github.rest.issues.listLabelsOnIssue({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, per_page: 100 });
            const present = new Set(res.data.map(l => l.name));
            for (const name of stale) {
              if (!present.has(name)) continue;
              try {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, name });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
