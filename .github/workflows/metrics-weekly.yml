---
# Metrics snapshot for megadj.
#
# Calls the reusable snapshot job from webuildstuffio/repo-review
# (metrics-reusable.yml). megadj is private, so cross-repo reusable calls
# work directly — the old vendored snapshot copy was deleted (repo-review#143;
# the public-repo 422 workaround is obsolete).
name: metrics-weekly
"on":
  schedule:
    - cron: "0 13 * * *"  # daily 09:00 ET
  release:
    types: [published]
  workflow_dispatch:

jobs:
  snapshot:
    uses: webuildstuffio/repo-review/.github/workflows/metrics-reusable.yml@f63d804d5721aa0a80e2eed5a2a08d5af8e07f74  # yamllint disable-line rule:line-length
    with:
      run_snapshot: true
      language: typescript
      # daily cadence: skip when the last 24h had no commits
      activity_window: "24 hours ago"
    secrets: inherit
