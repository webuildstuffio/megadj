---
# Metrics gate for megadj (PR tier gates).
#
# Calls the reusable gate job from webuildstuffio/repo-review
# (metrics-reusable.yml). megadj is private, so cross-repo reusable calls
# work directly — the old vendored gate copy was deleted (repo-review#143;
# the public-repo 422 workaround is obsolete).
#
# warn_only: true preserves the previous behavior of the vendored gate
# (findings become PR annotations, never fail the PR).
name: metrics-gate
"on":
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Superseded PR runs cancel. Caller concurrency is safe
# since repo-review#238 (reusable inner group renamed
# `metrics-gate-inner-...`, so it can never equal this
# group; equal strings previously cancelled the whole
# run instantly, ~2s, zero jobs). Needs the pin below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    # pull-requests: write lets the reusable's prlabels step read this PR's
    # live labels and post its gate comments (folio-app pattern, proven on
    # goldoutput.com); contents: read is what checkout + gate reads need.
    permissions:
      contents: read
      pull-requests: write
    uses: webuildstuffio/repo-review/.github/workflows/metrics-reusable.yml@f146f8440487930d0fdefb5132a61b1f6c25d38b  # yamllint disable-line rule:line-length
    with:
      run_snapshot: false
      language: typescript
      warn_only: true
    secrets: inherit
