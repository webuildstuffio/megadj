---
# Metrics gate for megadj (PR tier gates).
#
# Calls the reusable gate job from webuildstuffio/repo-review
# (metrics-reusable.yml). megadj is private, so cross-repo reusable calls
# work directly — the old vendored gate copy was deleted (repo-review#143;
# the public-repo 422 workaround is obsolete).
#
# warn_only: true preserves the previous behavior of the vendored gate
# (findings become PR annotations, never fail the PR).
name: metrics-gate
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  gate:
    # No concurrency block: adding one (workflow- or job-level)
    # hard-fails this reusable-workflow call at queue time
    # (verified 2026-10-09, emf.exposed runs 37875294727 /
    # 37875962995; draft-only passes).
    if: github.event.pull_request.draft == false
    uses: webuildstuffio/repo-review/.github/workflows/metrics-reusable.yml@8d8b4047bf022be629172550a0a21d26257eb543  # yamllint disable-line rule:line-length
    with:
      run_snapshot: false
      language: typescript
      warn_only: true
    secrets: inherit
