---
# Snyk replacement: per-PR fast secret+vulnerability scan plus a
# weekly Trivy deep scan. Logic lives in the reusable workflow;
# this file is just the triggers.
#
# Reusable: webuildstuffio/repo-review
#   .github/workflows/security-scan-reusable.yml@<full-sha>
# (repo-review is the canonical host; the gh-actions-and-skills copy
# cannot be used — see repo-review#143 notes.)
#
# Added by repo-review#143 (megadj is private, so the cross-repo
# reusable call works directly).
name: security-scan
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC — weekly deep scan
  workflow_dispatch:

jobs:
  fast:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    uses: webuildstuffio/repo-review/.github/workflows/security-scan-reusable.yml@aa907e96c2c5784aa15553fdf8c302d9a072b1e2  # yamllint disable-line rule:line-length
    secrets: inherit

  deep:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: webuildstuffio/repo-review/.github/workflows/security-scan-reusable.yml@aa907e96c2c5784aa15553fdf8c302d9a072b1e2  # yamllint disable-line rule:line-length
    with:
      deep: true
    secrets: inherit
