---
# Snyk replacement: per-PR fast secret+vulnerability scan plus a
# weekly Trivy deep scan. Logic lives in the reusable workflow;
# this file is just the triggers.
#
# Reusable: webuildstuffio/repo-review
#   .github/workflows/security-scan-reusable.yml@<full-sha>
# (repo-review is the canonical host; the gh-actions-and-skills copy
# cannot be used — see repo-review#143 notes.)
#
# Added by repo-review#143 (megadj is private, so the cross-repo
# reusable call works directly).
name: security-scan
"on":
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC — weekly deep scan
  workflow_dispatch:

# Superseded runs cancel. Caller concurrency is safe
# since repo-review#238 (reusable inner group renamed
# `security-scan-inner-...`, so it can never equal this
# group; equal strings previously cancelled the whole
# run instantly, ~2s, zero jobs). Keyed by ref, so PR
# runs never cancel the weekly deep scan. Pin below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # PR-only (2026-10-09): the old push leg re-ran this scan on
    # every PR merge commit. Main stays covered by the weekly
    # Trivy deep scan below (schedule) and workflow_dispatch.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    uses: webuildstuffio/repo-review/.github/workflows/security-scan-reusable.yml@f146f8440487930d0fdefb5132a61b1f6c25d38b  # yamllint disable-line rule:line-length
    with:
      # Opengrep SAST (repo-review#354): p/ci gate tier blocks on
      # new ERRORs in the diff; breadth + zizmor report-only.
      opengrep: true
      opengrep_gate: true
      zizmor: true
    secrets: inherit

  deep:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: webuildstuffio/repo-review/.github/workflows/security-scan-reusable.yml@f146f8440487930d0fdefb5132a61b1f6c25d38b  # yamllint disable-line rule:line-length
    with:
      deep: true
      opengrep_deep: true
    secrets: inherit
