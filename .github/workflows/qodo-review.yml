# Qodo AI Code Suggestions v3.3
# Inline code suggestions only — the highest-value, lowest-noise output.
# All config lives in webuildstuffio/pr-agent-settings/.pr_agent.toml (global)
# and per-repo .pr_agent.toml (overrides). This workflow is intentionally minimal.
#
# Model: google/gemma-4-31b-it:free primary, 8-model :free fallback chain.
# API: direct OpenRouter (no AI Gateway proxy — CF gateway corrupts streaming).
# DO NOT use openrouter/free as primary — proven broken (silent no-reviews).
# NOTE: webuildstuffio/pr-agent-settings MUST stay PUBLIC — the default
# GITHUB_TOKEN cannot read it as a private repo (404), which silently drops
# all global tuning (temperature, score threshold, focus instructions).
# /review and /describe available via manual /command in PR comments.
#
# CHANGELOG:
# v3.3.1: (Sep 30 2026) Fix: issue_comment events cancelled in-progress PR reviews
#          via shared concurrency group. Root cause: GH Actions evaluates concurrency
#          BEFORE job-level 'if:', so any bot comment entering the same group killed
#          the running /improve job. Fix: include event_name in group key.
# v3.3.0: (Sep 30 2026) Concurrency groups, improved caching, permission polish.
# v3.2.1: (Sep 29 2026) Bypass CF AI Gateway — route directly to OpenRouter.
# v3.2.0: (Sep 29 2026) gemma-4-31b primary + 8-model :free fallback chain.

name: Qodo AI Code Suggestions

"on":
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (empty = latest open PR)"
        required: false
        type: string

concurrency:
  group: qodo-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  suggest:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        ) ||
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            contains(github.event.comment.body, '/improve') ||
            contains(github.event.comment.body, '/review') ||
            contains(github.event.comment.body, '/describe')
          )
        )
      }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Code Suggestions (free models)
    steps:
      - name: Docker Cache
        uses: actions/cache@v6
        with:
          path: /var/lib/docker
          key: qodo-docker-${{ runner.os }}
          restore-keys: qodo-docker-

      - name: Set PR for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const n = '${{ github.event.inputs.pr_number }}';
            if (n) { core.exportVariable('TARGET_PR', n); return; }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', sort: 'updated', direction: 'desc', per_page: 1
            });
            if (prs.length) { core.exportVariable('TARGET_PR', prs[0].number); }
            else { core.setFailed('No open PRs'); }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Qodo /improve
        uses: qodo-ai/pr-agent@v0.46.0
        env:
          OPENROUTER__KEY: ${{ secrets.QODO_OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "openrouter/google/gemma-4-31b-it:free"
          config.fallback_models: >-
            ["openrouter/qwen/qwen3.8-27b:free",
            "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free",
            "openrouter/nvidia/nemotron-3-super-120b-a12b:free",
            "openrouter/cohere/north-mini-code:free",
            "openrouter/inclusionai/ling-3.0-flash-sante:free",
            "openrouter/nvidia/nemotron-3.5-lightning:free",
            "openrouter/poolside/laguna-s-2.1:free",
            "openrouter/free"]
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "131072"
          github_action_config.auto_improve: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
