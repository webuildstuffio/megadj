# CI — every PR and push to main must pass check + test on macOS.
# megadj is macOS-only by design (see docs/PRINCIPLES.md §2), so CI runs on the
# platform we ship for. Public repo → hosted macOS runners are free.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # fulltags ground-truth readers + tests shell out to `uv run --with mutagen python`
      - uses: astral-sh/setup-uv@v5

      # ffmpeg/ffprobe: ingest art, wav→aiff, probes (preinstalled on the
      # macOS image, but pinned explicitly so image changes can't break us)
      - name: Ensure ffmpeg
        run: |
          which ffmpeg || brew install ffmpeg
          which ffprobe || brew install ffmpeg

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck + lint
        run: bun run check

      - name: Tests
        run: bun test
