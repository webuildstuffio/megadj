# CI gate — static checks (blocking) + test suite (informational).
#
# megadj is macOS-only (docs/PRINCIPLES.md §2 — rekordbox, Pioneer
# hardware, browser cookies). The pre-push hook runs the full test
# suite locally on the developer's Mac.  CI runs the platform-agnostic
# static checks as the blocking gate; tests run on Linux for visibility
# but don't block (many tests need macOS-only tools).
#
# Trigger: pull_request only (2026-10-09). This suite used to also run
# on every push to main, so each PR merge re-ran it on a tree-identical
# commit. Direct pushes to main ended 2026-10-01 and every landing
# since is a PR merge, so the PR is now the single gate; the local
# pre-push hook remains the gate for any direct-push work.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check + lint + format + build
        run: bun run check

      - name: Tests (informational — macOS-only tests expected to fail)
        continue-on-error: true
        env:
          MEGADJ_ALLOW_LINUX: "1"
        run: bun test
