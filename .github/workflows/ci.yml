# CI gate — static checks (blocking) + test suite (informational).
#
# megadj is macOS-only (docs/PRINCIPLES.md §2 — rekordbox, Pioneer
# hardware, browser cookies). The pre-push hook runs the full test
# suite locally on the developer's Mac.  CI runs the platform-agnostic
# static checks as the blocking gate; tests run on Linux for visibility
# but don't block (many tests need macOS-only tools).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check + lint + format + build
        run: bun run check

      - name: Tests (informational — macOS-only tests expected to fail)
        continue-on-error: true
        env:
          MEGADJ_ALLOW_LINUX: "1"
        run: bun test
