name: Bug report
description: Something broke — tell us what, include the output
labels: ["bug"]
body:
  - type: textarea
    id: what-ran
    attributes:
      label: What did you run?
      description: Exact command + flags (`--json` output is ideal).
      placeholder: megadj audit --json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What actually happened?
      description: Paste error output / JSON / logs.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: `megadj doctor` output (optional but speeds up triage)
      render: text
