# Bun runtime config.
# [test] timeout: per-test overrides carry the heavy numbers — the ONNX
# suites (models/analysis, cold `uv run --with` env provisioning ~100 MB)
# pass 120–240s explicitly (bunfig timeout as second arg or { timeout }),
# and cratedeck's e2e bounds its server boot with a 30s beforeAll deadline.
# The global is a fast-fail for everything else: a wedged unit test fails
# in seconds, not after a minute of silence.
[test]
timeout = 15000
# Coverage report skips test files themselves (default reports them).
coverageSkipTestFiles = true

[install]
# Workspaces resolve from the root lockfile.

# Org standard (chore/standardize-supply-chain): 5-day automated poison window.
# Ignore package versions published < 5 days ago. 5d = 432000s.
minimumReleaseAge = 432000
