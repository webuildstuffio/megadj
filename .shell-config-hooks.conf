# shell-config per-repo hook configuration
# Docs: https://github.com/webuildstuffio/shell-config (lib/git/shared/hook-bootstrap.sh)
#
# Format: KEY=VALUE only. Values restricted to [A-Za-z0-9_./:@+-] — no
# quotes, $, backticks, spaces. Unsafe lines are ignored with a warning.
#
# No grandfather exceptions remain — no file is exempt from the length guard.

# Block only AT the documented max, not at 75% of it (default 75) —
# approaching the limit is a heads-up, not a block.
SC_FILE_LENGTH_BLOCK_PERCENT=100

# Staged-scope tests (shell-config issue #312): pre-commit runs only the test
# files that map to staged paths, not the whole suite. megadj runs multiple
# agents in one worktree — a WIP test file anywhere otherwise blocks every
# agent's commit. The FULL suite remains the pre-push gate
# (bun run check && bun test) — see AGENTS.md "Ground rules".
SC_HOOK_TEST_SCOPE=staged

# Commit latency (shell-config issue #339): the shared hook re-ran the full
# bun test suite at commit time even though `bun run check` + the pre-push
# regression gate already cover it — p50 was 10.4s (≈2.1h/week of pure
# commit waiting). balanced drops tests-at-commit; lint/format/knip stay
# (they catch things bun run check reports only in aggregate, and they run
# staged-scope so they are cheap). With tests disabled the critical path
# becomes opengrep (~4s with jobs tuning) instead of tests (~15s).
SC_HOOK_LEVEL=balanced

# OpenGrep: keep registry auto rules (deepest coverage; the hook now runs
# --jobs 4 which halved the scan). Flip to "local" only if commit latency
# ever matters more than registry-rule coverage — CI must then own the
# full-pack scan.
SC_OPENGREP_CONFIG=auto


# HOOK CHAINING (Sep 15 2026): core.hooksPath points at the REPO-LOCAL
# .githooks/pre-commit, which runs THIS shared hook first and then the
# repo's LOC-budget gate (tools/loc-budget.ts: net code reduction until
# 75k — see the quality-trend canvas). Do NOT reset core.hooksPath back
# to ~/.githooks: that silently drops the LOC gate. Bypass the gate alone
# with MEGADJ_LOC_BYPASS="reason" (audit-logged); GIT_SKIP_HOOKS=1 still
# means "skip non-security checks" for the shared hook AND the gate.
