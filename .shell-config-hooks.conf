# shell-config per-repo hook configuration
# Docs: https://github.com/webuildstuffio/shell-config (lib/git/shared/hook-bootstrap.sh)
#
# Format: KEY=VALUE only. Values restricted to [A-Za-z0-9_./:@+-] — no
# quotes, $, backticks, spaces. Unsafe lines are ignored with a warning.
#
# Why this file exists: megadj predates the file-length guard. Two
# long-lived files carry most of the UI surface in one sheet by design:
#
# - cratedeck/web/styles.css (~2169 lines): the whole single-sheet design
#   system for the CrateDeck dashboard. Splitting it is a real refactor
#   with merge-conflict cost across every UI PR; tracked in ideas.md,
#   not something a commit hook should force mid-feature. CSS has no
#   language tier in the shared limits table, so it falls to the 800
#   default meant for code.
# - cratedeck/src/db.ts (802 lines): actively being split (fleet-db.ts,
#   db_ledger.ts, notes queries moved out already); the remainder is
#   one schema+migrations block + thin query methods.

# Block only AT the documented max, not at 75% of it (default 75) —
# approaching the limit is a heads-up, not a block.
SC_FILE_LENGTH_BLOCK_PERCENT=100
